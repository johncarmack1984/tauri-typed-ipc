# Shared mock-IPC plumbing for the benchmark twins. A separate crate so
# both arms run byte-identical harness code across their separate
# dependency graphs (see the twin manifests for why they stay split).
[package]
name = "bench-common"
version = "0.0.0"
edition = "2024"
publish = false

# Detach from any enclosing workspace.
[workspace]

[dependencies]
tauri = { version = "2", default-features = false, features = ["test"] }
