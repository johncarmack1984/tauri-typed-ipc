# The tauri-typed-ipc arm of the cross-framework comparison. Twin of
# ../taurpc: same fixtures shape, same control arm, different IPC
# layer. Detached crate with its own lockfile. The split is forced: this
# crate pins specta =2.0.0-rc.28 and taurpc 0.8.2 pins =2.0.0-rc.25, and
# one graph can't hold both. It would stay split anyway, because each
# twin's numbers are published as a delta over its own raw_command
# control; merging the binaries would redefine that baseline.
[package]
name = "tauri-typed-ipc-bench"
version = "0.0.0"
edition = "2024"
publish = false

# Detach from any enclosing workspace.
[workspace]

[dependencies]
bench-common = { path = "../common" }
# `validate` on to measure the opt-in boundary-validation arm's overhead.
ttipc = { package = "tauri-typed-ipc", path = "../../tauri-typed-ipc", features = ["validate"] }
serde_json = "1"
# Feature set matches the taurpc twin exactly (defaults on, even
# though tauri-typed-ipc itself needs neither wry nor custom-protocol) so the
# compile-time comparison measures the IPC layer, not tauri features.
tauri = { version = "2", features = ["test", "custom-protocol"] }

[dev-dependencies]
divan = "0.1"

[[bench]]
name = "ipc"
harness = false
