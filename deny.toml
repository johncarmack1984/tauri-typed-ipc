# cargo-deny config. Schema version 2.
# Run: cargo deny check advisories bans licenses sources

[graph]
# Check the full target matrix the crates actually support.
all-features = true

[advisories]
# version 2: vulnerabilities are always denied. Tune via `ignore` only.
db-urls = ["https://github.com/RustSec/advisory-db"]
# Flag unmaintained crates in our own tree; ignore deep transitive noise
# we cannot act on.
unmaintained = "workspace"
yanked = "deny"
ignore = [
    # Add advisory IDs here with a one-line reason when triage decides to
    # accept the risk, e.g.:
    # { id = "RUSTSEC-0000-0000", reason = "no fix available; not reachable" },
    # glib VariantStrIter unsoundness, pulled transitively via tauri's gtk 0.18
    # stack. No released tauri uses gtk/glib 0.20, so there is no upgrade path
    # yet; revisit when tauri moves to gtk-rs 0.20.
    { id = "RUSTSEC-2024-0429", reason = "glib VariantStrIter unsoundness; transitive via tauri's gtk 0.18 stack, no released tauri uses gtk/glib 0.20" },
]

[licenses]
# Permissive set covering the current tauri + specta dependency tree
# (confirmed via `cargo tree` / cargo-deny). All atomic SPDX ids seen are
# satisfiable from this list; OR clauses resolve to one of these.
allow = [
    "MIT",
    "MIT-0",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "Unicode-3.0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "0BSD",
    "MPL-2.0",
    "Unlicense",
    "CC0-1.0",
]
confidence-threshold = 0.8
exceptions = [
    # Per-crate license carve-outs go here if a crate needs a license not in
    # the global allow list, e.g.:
    # { allow = ["..."], crate = "some-crate" },
]

[bans]
# Duplicate versions are common in a tauri tree; surface them without
# failing the build.
multiple-versions = "warn"
wildcards = "warn"
# Path and git deps in our own workspace use version pins, not registry
# wildcards; do not flag them.
allow-wildcard-paths = true
deny = []
skip = []
skip-tree = []

[sources]
# Only crates.io by default; flag anything else for review.
unknown-registry = "warn"
unknown-git = "warn"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
