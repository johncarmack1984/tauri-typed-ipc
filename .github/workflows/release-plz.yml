name: release-plz

on:
  push:
    branches: [main]

permissions: {}

concurrency:
  group: release-plz
  cancel-in-progress: false

jobs:
  # Publishes any crate whose version is ahead of crates.io, then tags and
  # creates the GitHub release. Runs on every push to main; a no-op until a
  # release PR bumps the version. Runs on the workflow's own GITHUB_TOKEN
  # (repo workflow permissions are read+write): the tag and GitHub release
  # are authored by github-actions[bot], and nothing here triggers on tag or
  # release events, so the token's events-start-no-runs rule costs nothing.
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Gates behind the `release` environment (carry over any protection rules).
    environment: release
    permissions:
      contents: write
      # Required for the crates.io Trusted Publishing OIDC token exchange.
      id-token: write
    env:
      RUSTC_WRAPPER: sccache
      SCCACHE_GHA_ENABLED: "true"
      CARGO_INCREMENTAL: "0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable branch

      - uses: ./.github/actions/install-tauri-deps

      - uses: mozilla-actions/sccache-action@9e7fa8a12102821edf02ca5dbea1acd0f89a2696 # v0.0.10

      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          cache-targets: "false"

      - name: Run release-plz
        uses: release-plz/action@2eb1d8bcb770b4c48ccfaad919734b38b51958c9 # v0.5.131
        with:
          command: release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  release-pr:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Wait for the publish to finish before opening the next release PR.
    # Otherwise this job races `release` and reads crates.io mid-publish (a
    # lockstep workspace publishes crate-by-crate), opening a spurious bump PR.
    needs: release
    permissions:
      contents: write
      pull-requests: write
      actions: write # approve the release PR's held CI runs
    concurrency:
      group: release-plz-pr-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable branch

      - name: Run release-plz
        uses: release-plz/action@2eb1d8bcb770b4c48ccfaad919734b38b51958c9 # v0.5.131
        with:
          command: release-pr
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # A GITHUB_TOKEN branch push leaves the release PR's CI runs held in the
      # action_required state (GitHub holds workflow runs for events its own
      # token caused). Approve the held run for the branch tip so the release
      # PR carries a live green gate; held runs for superseded heads are
      # deleted — their commit is gone from the branch and they would only
      # linger pending in the Actions tab. Fail-soft throughout: an unapproved
      # run just means a manual "approve workflows" click before merging.
      - name: Approve the release PR's held CI runs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          branch=$(gh pr list --state open --json headRefName \
            --jq '[.[] | select(.headRefName | startswith("release-plz-"))][0].headRefName // empty')
          if [ -z "$branch" ]; then
            echo "no open release-plz PR; nothing to approve"
            exit 0
          fi
          tip=$(git ls-remote origin "refs/heads/$branch" | cut -f1)
          approved=""
          for i in 1 2 3; do
            sleep 10
            id=$(gh run list --branch "$branch" --status action_required --limit 10 --json databaseId,headSha \
              --jq ".[] | select(.headSha==\"$tip\") | .databaseId" | head -1)
            if [ -n "$id" ]; then
              gh api -X POST "repos/${GITHUB_REPOSITORY}/actions/runs/$id/approve" >/dev/null \
                && { approved=1; echo "approved held run $id (tip ${tip:0:7})"; } \
                || echo "::warning::could not approve held run $id (approve manually before merging)"
              break
            fi
          done
          [ -n "$approved" ] || echo "no held run for the branch tip (nothing newly pushed, or it already ran)"
          gh run list --branch "$branch" --status action_required --limit 10 --json databaseId,headSha \
            --jq ".[] | select(.headSha!=\"$tip\") | .databaseId" \
            | while read -r stale; do
                gh api -X DELETE "repos/${GITHUB_REPOSITORY}/actions/runs/$stale" >/dev/null \
                  && echo "deleted stale held run $stale" \
                  || echo "::warning::could not delete stale held run $stale"
              done
