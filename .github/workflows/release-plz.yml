name: release-plz

# Drives releases from main. release-plz opens a "release PR" that bumps the
# workspace version and updates CHANGELOG.md; merging that PR publishes the
# crates to crates.io and creates the vX.Y.Z tag + GitHub release.
#
# Auth: crates.io Trusted Publishing (OIDC). No CARGO_REGISTRY_TOKEN. Trusted
# Publishing must be configured on crates.io for EACH published crate
# (tauri-typed-ipc, tauri-typed-ipc-macros, tauri-typed-ipc-migrate) pointing at
# THIS file: owner = johncarmack1984, repo = tauri-typed-ipc,
# workflow = release-plz.yml. (Replaces the old release.yml trusted publisher.)

on:
  push:
    branches: [main]

permissions: {}

jobs:
  # Publishes any crate whose version is ahead of crates.io, then tags and
  # creates the GitHub release. Runs on every push to main; a no-op until a
  # release PR bumps the version.
  release:
    name: release-plz release
    runs-on: ubuntu-latest
    # Gates behind the `release` environment (carry over any protection rules).
    environment: release
    permissions:
      contents: write
      # Required for the crates.io Trusted Publishing OIDC token exchange.
      id-token: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@stable

      # `cargo publish` runs a verify build of tauri-typed-ipc, which links the
      # GTK/WebKitGTK stack on Linux, so these libs must be present.
      - name: Install Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libxdo-dev libssl-dev libayatana-appindicator3-dev

      - name: Run release-plz
        uses: release-plz/[email protected]
        with:
          command: release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Opens/updates the release PR (version bump + changelog). The PR is reviewed
  # before merge per the repo's no-merge-without-review rule.
  #
  # Note: PRs opened with GITHUB_TOKEN do not trigger other workflows, so ci.yml
  # will not run on the release PR. To get CI on it, set a PAT or GitHub App
  # token as a secret and pass it as the action's `github_token`.
  release-pr:
    name: release-plz PR
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    concurrency:
      group: release-plz-pr-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@stable

      - name: Run release-plz
        uses: release-plz/[email protected]
        with:
          command: release-pr
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
