name: Release

# Publishes all three crates to crates.io on a pushed `v*` tag.
#
# Auth: crates.io Trusted Publishing (OIDC). No CARGO_REGISTRY_TOKEN secret.
# Requires Trusted Publishing to be configured on crates.io for THIS repo
# (Settings -> Trusted Publishing) for each of the three crates:
#   tauri-typed-ipc-macros, tauri-typed-ipc, tauri-typed-ipc-migrate
# Set owner = johncarmack1984, repo = tauri-typed-ipc, workflow = release.yml.
# Each crate needs one manual publish before its trusted publisher can be
# added on crates.io.
on:
  push:
    tags: ["v*"]

permissions: {}

jobs:
  publish:
    name: publish to crates.io
    runs-on: ubuntu-latest
    # Optional: gate behind a `release` environment for protection rules.
    environment: release
    permissions:
      # Required for the OIDC token exchange with crates.io.
      id-token: write
    env:
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@v6

      - uses: dtolnay/rust-toolchain@stable

      # Tauri's Linux build links against the GTK/WebKitGTK stack; cargo publish
      # runs a verify build of tauri-typed-ipc, so these libs must be present.
      - name: Install Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libxdo-dev libssl-dev libayatana-appindicator3-dev

      # Exchanges the GitHub OIDC token for a short-lived crates.io token,
      # exposed as steps.auth.outputs.token. Revoked when the job ends.
      - name: Authenticate to crates.io
        id: auth
        uses: rust-lang/crates-io-auth-action@v1

      # Publish in dependency order. tauri-typed-ipc depends on
      # tauri-typed-ipc-macros at "=0.1.0", so the macros crate must be in the
      # index before the lib resolves. cargo publish blocks until its own
      # upload is indexed, but a dependent publish can still race the sparse
      # index, so wait for the new version to be queryable before continuing.
      - name: Publish tauri-typed-ipc-macros
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        run: cargo publish -p tauri-typed-ipc-macros

      - name: Wait for tauri-typed-ipc-macros in the index
        run: |
          version="$(cargo metadata --no-deps --format-version 1 \
            | python3 -c 'import json,sys; print(next(p["version"] for p in json.load(sys.stdin)["packages"] if p["name"]=="tauri-typed-ipc-macros"))')"
          url="https://index.crates.io/ta/ur/tauri-typed-ipc-macros"
          for i in $(seq 1 30); do
            if curl -sf "$url" | grep -q "\"vers\":\"$version\""; then
              echo "tauri-typed-ipc-macros $version is indexed"
              exit 0
            fi
            echo "attempt $i: $version not indexed yet; sleeping 10s"
            sleep 10
          done
          echo "timed out waiting for tauri-typed-ipc-macros $version" >&2
          exit 1

      - name: Publish tauri-typed-ipc
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        run: cargo publish -p tauri-typed-ipc

      - name: Wait for tauri-typed-ipc in the index
        run: |
          version="$(cargo metadata --no-deps --format-version 1 \
            | python3 -c 'import json,sys; print(next(p["version"] for p in json.load(sys.stdin)["packages"] if p["name"]=="tauri-typed-ipc"))')"
          url="https://index.crates.io/ta/ur/tauri-typed-ipc"
          for i in $(seq 1 30); do
            if curl -sf "$url" | grep -q "\"vers\":\"$version\""; then
              echo "tauri-typed-ipc $version is indexed"
              exit 0
            fi
            echo "attempt $i: $version not indexed yet; sleeping 10s"
            sleep 10
          done
          echo "timed out waiting for tauri-typed-ipc $version" >&2
          exit 1

      # tauri-typed-ipc-migrate is standalone (no intra-workspace deps), so no
      # wait is needed after it.
      - name: Publish tauri-typed-ipc-migrate
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        run: cargo publish -p tauri-typed-ipc-migrate
