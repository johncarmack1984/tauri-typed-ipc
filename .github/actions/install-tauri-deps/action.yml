name: Install Tauri system dependencies
description: "Install (and cache) the GTK/WebKitGTK system libraries Tauri's Linux build links against."
# Tauri's Linux build links against the GTK/WebKitGTK stack, so the workspace
# pulls glib-sys et al. even with default-features = false. Needed to build,
# test, doc, or publish on Linux runners.
runs:
  using: composite
  steps:
    # WebKitGTK's dependency closure is ~60-70 packages (the GStreamer
    # multimedia stack). Caching turns the install into a tar-unpack from
    # GitHub's cache (no network) instead of a slow re-download from the Azure
    # apt mirror -- the source of the multi-minute install hangs. A cache miss
    # installs normally and refreshes apt lists, so it is self-healing. Bump
    # `version` to invalidate the cache. SHA-pinned; review the diff before
    # bumping the pin.
    - uses: awalsh128/cache-apt-pkgs-action@681749ae568c81c2037cb9185e38b709b261bd2f # v1.6.1
      with:
        packages: libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libxdo-dev libssl-dev libayatana-appindicator3-dev
        version: "1.0"
