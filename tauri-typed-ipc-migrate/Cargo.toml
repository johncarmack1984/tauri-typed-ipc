[package]
name = "tauri-typed-ipc-migrate"
description = "Codemod that migrates a TauRPC codebase to tauri-typed-ipc."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme = "README.md"
keywords = ["tauri", "taurpc", "migration", "codemod", "ipc"]
categories = ["command-line-utilities", "development-tools"]
exclude = ["src/snapshots/", "tests/"]

[lib]
name = "ttipc_migrate"

[[bin]]
name = "ttipc-migrate"
path = "src/main.rs"

[dependencies]
prettyplease.workspace = true
proc-macro2 = { workspace = true, features = ["span-locations"] }
syn = { workspace = true, features = ["visit", "visit-mut"] }

[dev-dependencies]
divan.workspace = true
insta.workspace = true
tempfile.workspace = true

[[bench]]
name = "transform"
harness = false

[package.metadata.cargo-machete]
ignored = ["proc-macro2"]  # feature-activation dep (span-locations); not imported directly

[lints]
workspace = true
