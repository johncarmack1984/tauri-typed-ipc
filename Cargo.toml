[workspace]
members = ["tauri-typed-ipc", "tauri-typed-ipc-macros", "tauri-typed-ipc-migrate", "tests"]
resolver = "3"

[workspace.package]
version = "0.1.7"
edition = "2024"
rust-version = "1.96"
license = "MIT OR Apache-2.0"
repository = "https://github.com/johncarmack1984/tauri-typed-ipc"

[workspace.dependencies]
tauri-typed-ipc = { version = "=0.1.7", path = "tauri-typed-ipc" }
tauri-typed-ipc-macros = { version = "=0.1.7", path = "tauri-typed-ipc-macros" }

# Pinned exact through the rc churn; bump deliberately per release
# until specta 2.0.0 stable.
specta = "=2.0.0-rc.26"
specta-typescript = "=0.0.13"
specta-serde = "=0.0.13"
# Test-only: the Remapper consumer story for Bindings::map_types.
specta-util = "=0.0.13"
# Opt-in `validate` feature only. rc.26 lane: 0.0.4 is the specta-jsonschema that
# tracks specta rc.26 (0.0.3 pins rc.25); resolved from the same upstream rev
# below. On main this is `=0.0.3` (rc.25) until the rc.26 release lands.
specta-jsonschema = "=0.0.4"
# default-features off: drops reqwest + TLS for remote $ref resolution, which
# the self-contained contract does not need.
jsonschema = { version = "0.29", default-features = false }

proc-macro2 = "1"
proc-macro-crate = "3"
quote = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
syn = { version = "2", features = ["full"] }
# No default features: tauri-typed-ipc only needs the invoke pipeline types;
# consumers bring their own windowing features.
tauri = { version = "2", default-features = false }
thiserror = "2"

divan = "0.1"
insta = "1"
prettyplease = "0.2"
tempfile = "3"
trybuild = "1"

[workspace.lints.rust]
missing_docs = "warn"
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
unwrap_used = "warn"
panic = "warn"
todo = "warn"

# rc.26 / 0.0.13 are merged on specta main but unpublished (crates.io still serves
# rc.25 / 0.0.12); resolve them from the pinned upstream rev until the release lands,
# then drop this section.
[patch.crates-io]
specta = { git = "https://github.com/specta-rs/specta", rev = "ef21f0544e153b944ff5d1b3afd20472afcf760c" }
specta-serde = { git = "https://github.com/specta-rs/specta", rev = "ef21f0544e153b944ff5d1b3afd20472afcf760c" }
specta-typescript = { git = "https://github.com/specta-rs/specta", rev = "ef21f0544e153b944ff5d1b3afd20472afcf760c" }
specta-util = { git = "https://github.com/specta-rs/specta", rev = "ef21f0544e153b944ff5d1b3afd20472afcf760c" }
specta-jsonschema = { git = "https://github.com/specta-rs/specta", rev = "ef21f0544e153b944ff5d1b3afd20472afcf760c" }
