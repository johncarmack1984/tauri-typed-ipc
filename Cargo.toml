[workspace]
members = ["tauri-typed-ipc", "tauri-typed-ipc-macros", "tests"]
resolver = "3"

[workspace.package]
version = "0.0.0"
edition = "2024"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
tauri-typed-ipc = { version = "=0.0.0", path = "tauri-typed-ipc" }
tauri-typed-ipc-macros = { version = "=0.0.0", path = "tauri-typed-ipc-macros" }

# Pinned exact through the rc churn; bump deliberately per release
# until specta 2.0.0 stable.
specta = "=2.0.0-rc.25"
specta-typescript = "=0.0.12"
specta-serde = "=0.0.12"

proc-macro2 = "1"
proc-macro-crate = "3"
quote = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
syn = { version = "2", features = ["full"] }
# No default features: tauri-typed-ipc only needs the invoke pipeline types;
# consumers bring their own windowing features.
tauri = { version = "2", default-features = false }
thiserror = "2"

divan = "0.1"
insta = "1"
prettyplease = "0.2"
tempfile = "3"
trybuild = "1"

[workspace.lints.rust]
missing_docs = "warn"
unsafe_code = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
unwrap_used = "warn"
panic = "warn"
todo = "warn"
